name = "librecorsa-leaderboard"
main = "worker.ts"
compatibility_date = "2025-01-01"

# Create the namespace once with `npx wrangler kv namespace create LAPS`,
# then replace the placeholder id below with the id it prints.
[[kv_namespaces]]
binding = "LAPS"
id = "ec944cc0881541bf9fede6e68e545d61"

[vars]
# Origins allowed to call the board, comma-separated; "*" allows any site
ALLOWED_ORIGIN = "https://librecorsa.pages.dev,https://wysaiche.2221314.xyz"
